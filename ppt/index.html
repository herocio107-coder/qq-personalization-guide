<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QQ 个性化内容方向 · CP 交流会</title>
<style>
  :root{ --ink:#1A1A1A; --paper:#F7F6F2; --accent:#4E6272; --line:#DAD7CE; --mute:#8A867C; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif; color:var(--ink); overflow:hidden; }
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .frame{ position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  .slidewrap{ position:relative; width:min(100vw, calc(100vh * 16 / 9)); height:min(100vh, calc(100vw * 9 / 16)); }
  .slide{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity .35s ease; pointer-events:none; background:#fff; }
  .slide.active{ opacity:1; }
  #progress{ position:fixed; top:0; left:0; height:3px; background:var(--accent); width:0; transition:width .3s ease; z-index:40; }
  #bar{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
        display:flex; align-items:center; gap:14px; padding:9px 16px; z-index:30;
        background:rgba(255,255,255,.82); backdrop-filter:blur(12px);
        border:1px solid var(--line); border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.08);
        opacity:1; transition:opacity .4s ease; }
  #bar.hide{ opacity:0; pointer-events:none; }
  .btn{ width:34px; height:34px; border:none; border-radius:50%; background:transparent; color:var(--ink);
        font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s; }
  .btn:hover{ background:var(--paper); }
  .btn:disabled{ opacity:.28; cursor:default; }
  #counter{ font-size:13px; font-weight:600; letter-spacing:1px; min-width:58px; text-align:center; color:var(--ink); font-variant-numeric:tabular-nums; }
  #counter small{ color:var(--mute); font-weight:400; }
  .sep{ width:1px; height:20px; background:var(--line); }
  #thumbs{ position:fixed; inset:0; background:rgba(30,30,30,.6); backdrop-filter:blur(8px); z-index:50; display:none; padding:40px; overflow-y:auto; }
  #thumbs.open{ display:block; }
  .tgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; max-width:1400px; margin:0 auto; }
  .tcard{ position:relative; cursor:pointer; border-radius:8px; overflow:hidden; border:2px solid transparent; background:#fff; transition:transform .15s, border-color .15s; }
  .tcard:hover{ transform:translateY(-3px); }
  .tcard.cur{ border-color:#fff; }
  .tcard img{ width:100%; display:block; aspect-ratio:16/9; object-fit:cover; }
  .tnum{ position:absolute; left:8px; top:8px; background:rgba(26,26,26,.8); color:#fff; font-size:11px; font-weight:600; padding:2px 8px; border-radius:4px; }
  #thumbClose{ position:fixed; right:28px; top:22px; width:40px; height:40px; border:none; border-radius:50%; background:rgba(255,255,255,.9); font-size:20px; cursor:pointer; z-index:60; }
  .nav-zone{ position:absolute; top:0; bottom:60px; width:32%; z-index:20; cursor:pointer; }
  .nav-zone.left{ left:0; } .nav-zone.right{ right:0; }
  #hint{ position:fixed; left:50%; top:20px; transform:translateX(-50%); z-index:35;
         background:rgba(26,26,26,.82); color:#fff; font-size:12px; padding:7px 16px; border-radius:999px; letter-spacing:.5px; opacity:1; transition:opacity .6s ease; }
  #hint.hide{ opacity:0; pointer-events:none; }
  @media (max-width:640px){ #bar{ bottom:14px; gap:8px; padding:7px 12px;} .btn{width:30px;height:30px;} }
</style>
</head>
<body>
<div id="progress"></div>
<div id="hint">← → 翻页 · 点击左右翻页 · 按 G 看缩略图 · F 全屏</div>
<div id="stage"><div class="frame"><div class="slidewrap" id="slidewrap">
  <div class="nav-zone left" id="zoneL"></div><div class="nav-zone right" id="zoneR"></div>
</div></div></div>
<div id="bar">
  <button class="btn" id="first" title="首页">⇤</button>
  <button class="btn" id="prev" title="上一页">‹</button>
  <span id="counter"></span>
  <button class="btn" id="next" title="下一页">›</button>
  <button class="btn" id="last" title="末页">⇥</button>
  <span class="sep"></span>
  <button class="btn" id="grid" title="缩略图 (G)">▦</button>
  <button class="btn" id="fs" title="全屏 (F)">⛶</button>
</div>
<div id="thumbs"><button id="thumbClose">✕</button><div class="tgrid" id="tgrid"></div></div>
<script>
  const TOTAL = 21;
  const pad = n => String(n).padStart(2,'0');
  const wrap = document.getElementById('slidewrap');
  let cur = 1;
  for(let i=1;i<=TOTAL;i++){
    const img=document.createElement('img');
    img.className='slide'; img.dataset.i=i;
    img.src=`slides/slide-${pad(i)}.jpg`;
    img.loading = i<=2 ? 'eager':'lazy'; img.alt='第'+i+'页';
    wrap.appendChild(img);
  }
  const slides=[...document.querySelectorAll('.slide')];
  const counter=document.getElementById('counter');
  const progress=document.getElementById('progress');
  function show(n){
    cur=Math.max(1,Math.min(TOTAL,n));
    slides.forEach(s=>s.classList.toggle('active', +s.dataset.i===cur));
    counter.innerHTML=`${pad(cur)} <small>/ ${TOTAL}</small>`;
    progress.style.width=(cur/TOTAL*100)+'%';
    document.getElementById('prev').disabled=cur===1;
    document.getElementById('first').disabled=cur===1;
    document.getElementById('next').disabled=cur===TOTAL;
    document.getElementById('last').disabled=cur===TOTAL;
    document.querySelectorAll('.tcard').forEach(c=>c.classList.toggle('cur',+c.dataset.i===cur));
  }
  const next=()=>show(cur+1), prev=()=>show(cur-1);
  document.getElementById('next').onclick=next;
  document.getElementById('prev').onclick=prev;
  document.getElementById('first').onclick=()=>show(1);
  document.getElementById('last').onclick=()=>show(TOTAL);
  document.getElementById('zoneR').onclick=next;
  document.getElementById('zoneL').onclick=prev;
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ next(); e.preventDefault(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ prev(); }
    else if(e.key==='Home'){ show(1); } else if(e.key==='End'){ show(TOTAL); }
    else if(e.key.toLowerCase()==='g'){ toggleThumbs(); }
    else if(e.key.toLowerCase()==='f'){ toggleFs(); }
    else if(e.key==='Escape'){ document.getElementById('thumbs').classList.remove('open'); }
  });
  let tx=0;
  wrap.addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
  wrap.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40){ dx<0?next():prev(); } },{passive:true});
  function toggleFs(){ if(!document.fullscreenElement){ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); } else{ document.exitFullscreen&&document.exitFullscreen(); } }
  document.getElementById('fs').onclick=toggleFs;
  const tgrid=document.getElementById('tgrid');
  for(let i=1;i<=TOTAL;i++){
    const c=document.createElement('div'); c.className='tcard'; c.dataset.i=i;
    c.innerHTML=`<span class="tnum">${pad(i)}</span><img loading="lazy" src="slides/slide-${pad(i)}.jpg">`;
    c.onclick=()=>{ show(i); toggleThumbs(false); };
    tgrid.appendChild(c);
  }
  function toggleThumbs(force){ const t=document.getElementById('thumbs'); const open = force===undefined ? !t.classList.contains('open') : force; t.classList.toggle('open',open); }
  document.getElementById('grid').onclick=()=>toggleThumbs();
  document.getElementById('thumbClose').onclick=()=>toggleThumbs(false);
  let hideTimer; const bar=document.getElementById('bar');
  function poke(){ bar.classList.remove('hide'); clearTimeout(hideTimer); hideTimer=setTimeout(()=>bar.classList.add('hide'),2600); }
  document.addEventListener('mousemove',poke); document.addEventListener('touchstart',poke); poke();
  setTimeout(()=>document.getElementById('hint').classList.add('hide'),4200);
  show(1);
</script>
</body>
</html>
